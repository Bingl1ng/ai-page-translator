<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>AI 页面翻译</title>
  <style>
    body { width: 300px; margin: 0; font-family: system-ui, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; font-size: 13px; color: #202124; background: #fff; }
    .header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    .header .logo { font-size: 18px; }
    .header h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
    .body { padding: 4px 14px 14px; }
    .status { font-size: 12px; color: #5f6368; min-height: 16px; margin: 4px 0 10px; }
    .status.err { color: #d93025; }
    .btn { display: block; width: 100%; box-sizing: border-box; padding: 9px 0; border-radius: 8px; border: none; cursor: pointer; font: inherit; margin-bottom: 6px; }
    .btn.primary { background: #1a73e8; color: #fff; }
    .btn.primary:hover { background: #1765cc; }
    .btn.secondary { background: #f1f3f4; color: #202124; }
    .btn.secondary:hover { background: #e8eaed; }
    .btn:disabled { opacity: .45; cursor: default; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 4px; }
    .row label { color: #5f6368; }
    select { padding: 4px 6px; border-radius: 6px; border: 1px solid #c9cdd4; font: inherit; }
    .switch { position: relative; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .track { position: absolute; inset: 0; background: #c9cdd4; border-radius: 20px; transition: .2s; }
    .switch .track:before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch input:checked + .track { background: #1a73e8; }
    .switch input:checked + .track:before { transform: translateX(14px); }
    .warn { background: #fef7e0; border: 1px solid #f0dc9a; color: #7a5b00; padding: 7px 10px; border-radius: 6px; margin: 8px 0; font-size: 12px; }
    .foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; }
    a { color: #1a73e8; cursor: pointer; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hint { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
    .popup-progress { height: 4px; background: #e8eaed; border-radius: 2px; overflow: hidden; margin: 0 0 10px; }
    .popup-progress-fill { height: 100%; width: 0%; background: #1a73e8; transition: width .3s; }
    .usage { margin: 8px 0 4px; background: #f8f9fb; border: 1px solid #e0e3e8; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .usage-row { display: flex; justify-content: space-between; line-height: 1.7; }
    .usage-row .lbl { color: #5f6368; }
    .site-box { margin-top: 6px; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      .btn.secondary { background: #3c4043; color: #e8eaed; }
      .btn.secondary:hover { background: #4a4d51; }
      select { background: #292a2d; border-color: #5f6368; color: #e8eaed; }
      .switch .track { background: #5f6368; }
      .status { color: #9aa0a6; }
      .warn { background: #3a2f00; border-color: #5f4d00; color: #fdd663; }
      a { color: #8ab4f8; }
      .hint { color: #80868b; }
      .popup-progress { background: #3c4043; }
      .usage { background: #292a2d; border-color: #3c4043; }
      .usage-row .lbl { color: #9aa0a6; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🌐</span>
    <h1>AI 页面翻译</h1>
  </div>
  <div class="body">
    <div class="status" id="status">加载中…</div>
    <div class="popup-progress" id="progressWrap" style="display:none"><div class="popup-progress-fill" id="popupFill"></div></div>
    <button class="btn primary" id="translateBtn">翻译此页</button>
    <button class="btn secondary" id="retranslateBtn" disabled>重新翻译</button>
    <button class="btn secondary" id="retryFailedBtn" style="display:none">重试失败段落</button>
    <button class="btn secondary" id="restoreBtn" disabled>还原原文</button>
    <div class="row">
      <label for="lang">目标语言</label>
      <select id="lang"></select>
    </div>
    <div class="row">
      <label for="auto">打开外文页面自动翻译</label>
      <label class="switch"><input type="checkbox" id="auto"><span class="track"></span></label>
    </div>
    <div class="site-box" id="siteBox" style="display:none">
      <div class="row">
        <label for="siteAuto">此站点自动翻译</label>
        <label class="switch"><input type="checkbox" id="siteAuto"><span class="track"></span></label>
      </div>
      <div class="row">
        <label for="siteNever">此站点永不翻译</label>
        <label class="switch"><input type="checkbox" id="siteNever"><span class="track"></span></label>
      </div>
    </div>
    <div class="usage">
      <div class="usage-row"><span class="lbl">本次</span><span id="usageNow">–</span></div>
      <div class="usage-row"><span class="lbl">本月</span><span id="usageMonth">–</span></div>
    </div>
    <div class="hint">翻译由 DeepSeek AI 完成，按你的 API 用量计费。</div>
    <div class="warn" id="nokey" style="display:none">
      还没配置 API Key。<a id="openOptions">去设置 →</a>
    </div>
    <div class="foot">
      <a id="optionsLink">设置</a>
      <span id="pg"></span>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
